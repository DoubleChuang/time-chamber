<html lang="zh-Hant">

    <meta name="theme-color" content="#071f34" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/time-chamber/manifest.json" />
    <link rel="icon" href="/time-chamber/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/time-chamber/icon-192.png" />
    <title>Pause Breathe</title>
    <script>
      (function() {
        var light = '/favicon-light.svg';
        var dark = '/favicon.svg';
        function update() {
          var isLight = document.documentElement.getAttribute('data-theme') === 'ocean-day';
          var link = document.querySelector('link[rel="icon"]');
          if (link) link.href = isLight ? light : dark;
        }
        update();
        new MutationObserver(update).observe(document.documentElement, {
          attributes: true, attributeFilter: ['data-theme']
        });
      })();
    </script>
    <script type="module" crossorigin src="/time-chamber/assets/index-DrGDyf50.js"></script>
